<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>';
const sampleFiles=[{id:'research',name:'Customer interviews.pdf',type:'PDF',detail:'6 interviews · Fictional sample'},{id:'brief',name:'Northwind brand brief.docx',type:'DOCX',detail:'Current positioning · Fictional sample'},{id:'market',name:'Category & pricing.xlsx',type:'XLSX',detail:'Competitor snapshot · Fictional sample'}];
const evidence={taste:{file:'Customer interviews.pdf',ref:'Interview 04 · p. 7',quote:'I want something I feel good about eating. But if it doesn’t taste good, I won’t buy it twice.',note:'A taste-led opening is a hypothesis supported by this interview, not proof of market preference.'},brief:{file:'Northwind brand brief.docx',ref:'Brand promise · p. 2',quote:'Premium nutrition for people committed to better habits.',note:'This is the client’s current claim, not an independently verified product benefit.'},price:{file:'Category & pricing.xlsx',ref:'Pricing comparison · sheet 2',quote:'The competitor set includes both everyday and premium-priced snacks. No Northwind willingness-to-pay study is included.',note:'Competitor prices cannot establish what Northwind customers will pay.'},proof:{file:'Northwind brand brief.docx',ref:'Product claims · p. 4',quote:'The brief proposes natural ingredients and sustained energy. Supporting product tests are not attached.',note:'Keep these as claims to validate. Do not present untested performance as a fact.'}};
const directions={original:{name:'The client’s original framing',title:'BETTER NUTRITION.\nBETTER YOU.',sub:'Premium nutrition for people committed to better habits.',before:'A premium nutrition product for more disciplined habits.',after:'Keep the client’s existing nutrition-led story.',audience:'People seeking a more nutrition-led snack.',tradeoff:'Keeps the original framing; premium pricing and performance claims remain unvalidated.',rationale:'Retain the client’s starting point for discussion rather than assume a new direction is better.',refs:['brief','proof']},taste:{name:'Taste first. Confidence follows.',title:'THE SNACK YOU WANT.\nNOT THE ONE YOU SHOULD.',sub:'Familiar satisfaction first. Confidence in what you eat comes next.',before:'A healthy snack I should make myself choose.',after:'A snack I actually want, with ingredients I can feel good about.',audience:'People who want to eat well without giving up familiar taste.',tradeoff:'Stop leading with discipline or performance. Ingredient claims still need validation.',rationale:'The interview makes taste a reason to come back. Nutrition can reassure without becoming the opening pitch.',refs:['taste','brief']},energy:{name:'Fuel, not willpower.',title:'EVERYDAY ENERGY.\nNO DIET MENTALITY.',sub:'A more positive way to talk about the everyday snack break.',before:'A diet product asking me for more self-control.',after:'An everyday food that fits the way I already live.',audience:'Busy people looking for an easy everyday snack.',tradeoff:'An energy-led promise needs product evidence. Do not imply proven performance.',rationale:'Reframes the conversation around the daily routine, not restrictive habits. The promise remains a positioning hypothesis.',refs:['taste','proof']},ritual:{name:'A better daily ritual.',title:'MAKE THE EVERYDAY\nBREAK A LITTLE BETTER.',sub:'A familiar moment worth looking forward to.',before:'Another product competing on nutrition claims.',after:'Something that belongs in my everyday break.',audience:'People buying a familiar snack for a recurring daily occasion.',tradeoff:'Less differentiation on nutrition. The occasion and price need customer testing.',rationale:'Gives the story a clear use occasion without relying on unsupported performance claims.',refs:['taste','price']}};
const questions=[{tab:'The promise',finding:'People ask for healthier food. But familiar taste is what brings them back.',title:'What should lead the story?',refs:['taste','brief'],options:[{label:'Taste first',text:'Lead with familiar taste. Use ingredients as reassurance, not the opening promise.',direction:'taste',impact:'Taste becomes the invitation. Ingredients become the reassurance.'},{label:'Everyday energy',text:'Lead with everyday energy, not dieting. Keep performance claims open until we have proof.',direction:'energy',impact:'The story shifts from self-control to the everyday routine.'}]},{tab:'The price',finding:'The brief says “premium”. The material does not tell us what customers will pay.',title:'How should we handle the premium claim?',refs:['price','brief'],options:[{label:'Everyday choice',text:'Position this as an everyday choice. Leave a premium price claim out of the first conversation.',price:'everyday',impact:'The positioning now describes an everyday choice. The deck leaves premium pricing out.'},{label:'Leave it open',text:'Treat premium pricing as a question for the client, not a claim we can defend yet.',price:'open',impact:'The deck carries pricing as an open question, not an established advantage.'}]},{tab:'The proof',finding:'“Sustained energy” appears in the brief. Supporting product tests are missing.',title:'What can we confidently say today?',refs:['proof'],options:[{label:'No performance claims',text:'Do not claim a proven energy benefit. Make the proposed experience clear and list the proof we still need.',proof:'omit',impact:'Performance claims stay out. Missing product evidence becomes an explicit discussion point.'},{label:'Flag for validation',text:'Keep the energy idea as a positioning hypothesis, clearly marked for validation with product evidence.',proof:'hypothesis',impact:'The idea remains visible, but the deck labels it as a hypothesis to validate.'}]}];
const state={stage:'source',files:[],sourceVersion:0,error:'',opened:false,q:0,answers:['','',''],choice:[null,null,null],saved:[null,null,null],editing:true,pending:null,direction:'original',custom:null,price:null,proof:null,revision:0,undo:[],versions:[],viewVersion:null,page:0,mobile:'task'};
const clusters=[
 {key:'customers',name:'Customer needs',source:'research',level:'covered',summary:'6 sample interviews on taste, habits and expectations.',refs:['taste'],question:'Who are the customers, and what do they want from this snack?',why:'Without a customer view, the story can drift toward what the company wants to say.',example:'Busy office workers want a familiar snack they enjoy, without feeling they are making a bad food choice.',suggest:'Customer interviews, survey notes or a recent customer email.'},
 {key:'offer',name:'Product & offer',source:'brief',level:'covered',summary:'The current promise and offer are described in the brief.',refs:['brief'],question:'What does Northwind sell, and how does a customer use it?',why:'A clear description of the actual offer gives the positioning something concrete to stand on.',example:'A packaged snack for everyday breaks. The current brand story leads with nutrition and premium ingredients.',suggest:'Product brief, a product page or a short demo description.'},
 {key:'market',name:'Market & alternatives',source:'market',level:'covered',summary:'The sample includes competitor formats and prices.',refs:['price'],question:'What does a customer choose instead of Northwind today?',why:'Knowing the alternative helps us avoid a generic differentiation claim.',example:'A familiar convenience-store snack, rather than a specialist nutrition product.',suggest:'Competitor notes, pricing screenshots or a sales comparison.'},
 {key:'moment',name:'Buying moment',source:'research',level:'partial',summary:'We know what people value, but not the situation that triggers a purchase.',refs:['taste'],question:'When would someone reach for Northwind — and what would they buy instead?',why:'The interviews describe taste preferences, but the buying occasion is unclear. This context helps us make the opening story specific.',example:'An afternoon break at work. They would usually grab a familiar snack from the nearby shop, not a diet product.',suggest:'A customer conversation, sales note or purchase example. A short written answer is enough.'},
 {key:'proof',name:'Results & reasons to believe',source:null,level:'missing',summary:'The brief makes claims. Product results or customer outcomes are not supplied.',refs:['proof'],question:'What can you already show about the product or the customer experience?',why:'A result, customer quote or product detail can make the story tangible. If nothing is available, we can keep the claim open.',example:'We have qualitative comments about taste, but no measured repeat-purchase results or product-performance tests yet.',suggest:'A customer quote, product detail, case note or test result — only if you have one.'}
];
Object.assign(state,{contextDrafts:{},contextNotes:{},contextOpen:{},gap:'moment',uploadOpen:{},contextReviewedAt:-1,uploadGap:null,intakeReady:false,pasteOpen:false,briefDraft:'',brief:'',summaryEdit:false,summaryDraft:'',summaryOverride:'',contextPanel:'question',contextFeedback:null,overviewOpen:false,materialPanel:false});
const clusterFor=key=>clusters.find(c=>c.key===key);
const filesForGap=key=>state.files.filter(f=>f.gap===key);
function baseCoverage(c){return c.level==='covered'&&state.files.some(f=>f.id===c.source)?'covered':c.level==='partial'&&state.files.some(f=>f.id===c.source)?'partial':'missing'}
function gapKeys(){return clusters.filter(c=>baseCoverage(c)!=='covered').map(c=>c.key)}
function coverage(c){const pending=filesForGap(c.key).length,note=state.contextNotes[c.key];if(pending)return {label:'Needs review',kind:'partial',detail:`${pending} attached file${pending>1?'s':''} · Not analyzed${note?' · Context also recorded':''}`};if(note)return {label:'Context added',kind:'note',detail:'Your explanation is recorded, not independently verified.'};if(state.contextOpen[c.key])return {label:'Left open',kind:'open',detail:'Proceed without inventing an answer. Revisit when available.'};const base=baseCoverage(c);return {label:base==='covered'?'Enough to start':base==='partial'?'Needs context':'Not provided',kind:base==='covered'?'covered':'partial',detail:c.source&&!state.files.some(f=>f.id===c.source)?'The supporting sample source is not attached.':c.summary}}
let returnFocus=null,toastTimer;
const current=()=>state.direction==='custom'?state.custom:directions[state.direction];
const activeVersion=()=>state.versions.find(v=>v.id===state.viewVersion)||state.versions.at(-1);
const changed=()=>!!activeVersion()&&(activeVersion().revision!==state.revision||activeVersion().sourceVersion!==state.sourceVersion);
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function modal(title,body,wide=false){returnFocus=document.activeElement;const d=$('#dialog');d.className=wide?'wide':'';d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2><button class="icon-btn" data-act="close" aria-label="Close dialog">×</button></div><div class="dialog-body">${body}</div>`;d.showModal()}
$('#dialog').addEventListener('close',()=>{state.materialPanel=false;if(returnFocus?.isConnected)returnFocus.focus();else $('#main').focus()});
function close(){if($('#dialog').open)$('#dialog').close()}
function captureUndo(){state.undo.push({direction:state.direction,custom:structuredClone(state.custom),price:state.price,proof:state.proof,saved:structuredClone(state.saved)});if(state.undo.length>12)state.undo.shift()}
function showSources(keys){modal('What the material actually says',keys.map(key=>{const e=evidence[key];return `<article class="source-excerpt"><span class="eyebrow">${esc(e.file)}</span><blockquote>“${esc(e.quote)}”</blockquote><p>${esc(e.ref)}</p><p style="margin-top:12px">${esc(e.note)}</p></article>`}).join('')+'<p class="context-foot">Fictional excerpts for this interaction demo. No real documents have been analyzed.</p>')}
function render(){
 $('.project-id>strong').textContent=hasSample()?'Northwind Foods':'New project';
 $('#nav').innerHTML=[['source','Materials'],['context','Clarify'],['positioning','Positioning'],['deck','Deck']].map(([key,label])=>`<button data-act="nav" data-key="${key}" ${state.stage===key?'aria-current="page"':''} ${key==='deck'&&!state.versions.length?'disabled title="Create a deck from Positioning first"':''}>${label}</button>`).join('');
 $('#main').innerHTML=state.stage==='source'?renderSource():state.stage==='context'?renderContext():state.stage==='positioning'?renderPositioning():renderDeck();
 if(state.stage==='positioning'&&state.editing&&!state.pending){$('#answer').value=state.answers[state.q];$('#preview-btn').disabled=!state.answers[state.q].trim()}
 if(state.stage==='context'&&$('#context-answer')){$('#context-answer').value=state.contextDrafts[state.gap]??state.contextNotes[state.gap]??'';updateContextControls()}
 if($('#summary-edit'))$('#summary-edit').value=state.summaryDraft;
 if($('#brief-input'))$('#brief-input').value=state.briefDraft;
 if(state.materialPanel)renderMaterialManager();
}


function renderMaterialLibrary(){return `<section class="material-library"><header class="library-heading"><div><h1>Your project materials.</h1><p>Add to the project without restarting the conversation.</p></div><button class="btn" id="dropzone" data-act="files">Add files ${arrow}</button></header><div class="library-inventory"><div class="inventory-heading"><h2>Source files</h2><span>${state.files.length} file${state.files.length===1?'':'s'}</span></div>${fileRows(state.files)||'<p class="empty-library">No files attached. Add files above, or write a brief below.</p>'}</div>${state.error?`<p class="error" role="alert">${esc(state.error)}</p>`:''}<details class="material-brief" ${state.pasteOpen?'open':''}><summary>Written brief <span>${state.briefDraft.trim()!==state.brief?'Unsaved changes':state.brief?'Saved':'Optional'}</span></summary><label class="edit-label" for="brief-input">Your brief or notes</label><textarea id="brief-input" placeholder="Paste your starting material or explain the business in your own words."></textarea><div class="brief-actions"><span class="small muted" id="brief-status" role="status">${state.briefDraft.trim()!==state.brief?'Unsaved changes stay in this tab.':'Your words are kept literally, not analyzed.'}</span><button class="btn" data-act="save-brief">Save brief</button></div></details><div class="library-footer"><p class="note">Files are listed only in this offline mockup. Topic attachments also appear here.</p><button class="btn primary" data-act="resume-clarify">Back to Clarify ${arrow}</button></div></section>${footer()}`}
function saveBrief(){const value=state.briefDraft.trim();if(value!==state.brief){state.brief=value;state.sourceVersion++}state.briefDraft=value}
function resumeClarify(){if(!state.intakeReady){if(!state.files.length&&!state.briefDraft.trim()){toast('Add material or open the sample project to start clarifying.');return}saveBrief();enterContext();return}state.stage='context';state.error='';render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function openMaterials(){state.materialPanel=false;close();state.stage='source';state.error='';render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}

function hasSample(){return sampleFiles.every(f=>state.files.some(v=>v.id===f.id))}
const shortNames={customers:'Customer needs',offer:'Product & offer',market:'Alternatives',moment:'Buying moment',proof:'Reasons to believe'};
function projectSummary(){return state.summaryOverride||(hasSample()?'Northwind sells nutrition-led snacks. Customers talk about taste; the buying occasion is still unclear.':state.brief?'You have added a written brief. This offline mockup keeps your words below; it does not analyze them.':'Your files are listed, but their contents have not been read. Open the sample project to explore a prewritten understanding.')}
function fileRows(files){return files.map(f=>`<div class="file-row"><span class="file-type">${esc(f.type)}</span><div class="grow"><div class="file-name">${esc(f.name)}</div><div class="file-meta">${esc(f.detail)}</div>${f.gap?`<button class="file-topic" data-act="linked-context" data-key="${esc(f.gap)}">Linked to ${esc(shortNames[f.gap])}</button>`:''}</div><button class="plain" data-act="remove-file" data-key="${esc(f.id)}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('')}
function renderSource(){if(state.intakeReady)return renderMaterialLibrary();return `<section class="intake"><div class="intake-heading"><span class="intake-label">Your next client conversation</span><h1>Start with<br>what you have.</h1><p>A brief, interview notes, a half-finished deck.<br>We’ll help you find the story inside.</p></div>${state.files.length?`<div class="intake-files">${fileRows(state.files)}</div><button class="plain" data-act="files">Add more files</button>`:`<button class="dropzone" id="dropzone" data-act="files"><span class="plus" aria-hidden="true">+</span><strong>Drop your materials here</strong><span class="small muted">or choose files</span></button>`}<button class="plain paste-toggle" data-act="toggle-paste" aria-expanded="${state.pasteOpen}">${state.pasteOpen?'Hide written brief':'Or paste what you know'}</button>${state.pasteOpen?'<label for="brief-input" class="edit-label">Your brief or notes</label><textarea id="brief-input" placeholder="What is the business, who is it for, and what are you trying to communicate?"></textarea>':''}${state.error?`<p class="error" role="alert">${esc(state.error)}</p>`:''}${state.files.length||state.pasteOpen?`<div class="intake-continue"><button class="btn primary" data-act="intake-continue">Continue with these materials ${arrow}</button></div>`:''}<p class="note intake-disclaimer">Offline mockup. File names only; no upload or AI analysis.</p><div class="sample-entry"><div><strong>Want to get a feel for it?</strong><p>Explore a fictional snack brand with three sample sources.</p></div><button class="btn" data-act="open-sample">Open sample project ${arrow}</button></div></section>${footer()}`}
function renderClusters(){const open=matchMedia('(min-width:761px)').matches||state.overviewOpen;return `<aside class="project-map"><details class="overview-disclosure" ${open?'open':''}><summary>Project overview<span class="overview-summary">${gapKeys().filter(k=>!state.contextNotes[k]&&!state.contextOpen[k]).length} to clarify</span></summary><div class="compact-clusters" aria-label="Material clusters">${clusters.map(c=>{const s=coverage(c),label=s.kind==='covered'?'Material available':s.label;return `<button class="map-row ${state.gap===c.key?'active':''}" data-act="cluster" data-key="${c.key}" aria-pressed="${state.gap===c.key}"><span class="map-name">${shortNames[c.key]}</span><span class="map-status ${s.kind}">${label}</span>${state.contextNotes[c.key]?`<span class="map-context">${esc(state.contextNotes[c.key].length>90?state.contextNotes[c.key].slice(0,90)+'…':state.contextNotes[c.key])}</span>`:''}</button>`}).join('')}</div></details><button class="plain manage-materials" data-act="manage-materials">Manage materials <span>${state.files.length}</span></button></aside>`}
function renderSummary(){return `<section class="understanding" aria-label="Current understanding"><div class="row between"><h2>What we understand so far</h2><button class="plain" data-act="edit-summary">Correct this</button></div>${state.summaryEdit?`<label class="edit-label" for="summary-edit">Your understanding of the business</label><textarea id="summary-edit"></textarea><div class="summary-edit-actions"><button class="btn primary" data-act="save-summary">Save correction</button><button class="plain" data-act="cancel-summary">Cancel</button></div>`:`<p class="summary-copy">${esc(projectSummary())}</p><span class="summary-attribution">${state.summaryOverride?'Your correction · Not independently verified':hasSample()?'From the fictional sample · Not AI analysis':'Your materials · Not analyzed'}</span>`}${state.brief?`<details class="brief-detail"><summary>Your written brief</summary><p class="context-quote">${esc(state.brief)}</p></details>`:''}</section>`}
function renderGapUpload(c){const files=filesForGap(c.key);return `<details class="gap-upload compact-upload" ${state.uploadOpen[c.key]?'open':''} data-gap="${c.key}"><summary>Add related material${files.length?` · ${files.length} pending review`:''}</summary><p>${c.suggest}</p><button class="gap-dropzone" id="gap-dropzone" data-act="gap-files"><strong>Attach to ${shortNames[c.key].toLowerCase()}</strong><span>Choose files or drop them here</span></button><div class="gap-files">${files.map(f=>`<div class="gap-file"><div class="grow"><div class="gap-file-name">${esc(f.name)}</div><div class="file-meta">Pending review · Contents not read</div></div><button class="plain" data-act="remove-file" data-key="${esc(f.id)}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('')}</div>${state.error?`<p class="error" role="alert">${esc(state.error)}</p>`:''}</details>`}
function renderContext(){const c=clusterFor(state.gap);return `<header class="workspace-heading"><div><h1>Find the story in the material.</h1></div><span class="small muted">Keep unknowns open.</span></header><div class="preparation-grid">${renderClusters()}<section class="context-work">${renderSummary()}${state.summaryEdit?'':state.contextPanel==='details'?renderClusterDetails(c):state.contextPanel==='saved'?renderContextFeedback(c):renderFocusedQuestion(c)}<div class="positioning-exit"><span>Nothing else to add?</span><button class="plain" data-act="context-finish">Go straight to positioning ${arrow}</button></div></section></div>${footer()}`}
function renderFocusedQuestion(c){const keys=gapKeys().filter(k=>!state.contextNotes[k]&&!state.contextOpen[k]);return `<article class="focused-question" aria-label="Current question"><div class="question-meta"><span class="topic-marker">${shortNames[c.key]}</span><span>${state.contextNotes[c.key]?'Revisit your context':keys.length?`${keys.length} suggested topic${keys.length>1?'s':''}`:'Optional context'}</span></div><h2>${c.question}</h2><details class="question-rationale"><summary>Why this matters</summary><p>${c.why}</p>${hasSample()?`<button class="source-link" data-act="sources" data-keys="${c.refs.join(',')}">See relevant sample excerpts</button>`:''}</details><div class="answer-label"><label for="context-answer">Your context</label><button class="plain" data-act="context-example">Try a sample answer</button></div><textarea id="context-answer" placeholder="A few sentences are enough. It’s okay not to know yet."></textarea>${renderGapUpload(c)}<span class="small muted" id="context-save-status" role="status">${state.contextNotes[c.key]?'Saved as your explanation.':''}</span><div class="question-actions"><button class="plain" data-act="context-open">Not sure yet</button><button class="btn primary" id="context-save" data-act="save-context">Save context ${arrow}</button></div></article>`}
function nextGap(){return gapKeys().find(k=>k!==state.gap&&!state.contextNotes[k]&&!state.contextOpen[k])}
function renderContextFeedback(c){const f=state.contextFeedback||{before:'Not recorded',after:'Context added'},next=nextGap();return `<article class="context-result" aria-label="Context update"><span class="topic-marker">${shortNames[c.key]}</span><h2>${state.contextOpen[c.key]?'We can leave this open.':'The picture is getting clearer.'}</h2><div class="context-change"><span>Before</span><p>${esc(f.before)}</p><span>Now</span><p>${esc(f.after)}</p></div><p class="result-attribution">${state.contextOpen[c.key]?'No answer has been invented. You can revisit this later.':'Your explanation, not verified evidence. The positioning examples do not automatically change.'}</p><button class="plain" data-act="revise-context">Edit this context</button><div class="question-actions">${next?`<button class="btn primary" data-act="context-next" data-key="${next}">Next useful question ${arrow}</button>`:'<button class="btn primary" data-act="context-finish">Explore positioning directions '+arrow+'</button>'}</div></article>`}
function renderClusterDetails(c){const s=coverage(c);return `<article class="cluster-detail"><span class="topic-marker">${shortNames[c.key]}</span><h2>${s.label==='Enough to start'?'A useful starting point.':s.label}</h2><p>${esc(s.detail)}</p>${state.contextNotes[c.key]?`<div class="context-quote">${esc(state.contextNotes[c.key])}</div>`:''}${c.source&&state.files.some(f=>f.id===c.source)?`<div class="inline-evidence">${c.refs.map(k=>`<blockquote>${esc(evidence[k].quote)}<cite>${esc(evidence[k].file)} · ${esc(evidence[k].ref)}</cite></blockquote>`).join('')}</div>`:''}<div class="question-actions"><button class="btn" data-act="revise-context">Add or correct context</button><button class="plain" data-act="next-useful">Back to a useful question</button></div></article>`}
function updateContextControls(){const input=$('#context-answer'),btn=$('#context-save');if(!input||!btn)return;const value=input.value,dirty=!!value.trim()&&value.trim()!==state.contextNotes[state.gap];btn.disabled=!dirty;btn.textContent=dirty?'Save context':value.trim()?'Context saved':'Save context';if(dirty)$('#context-save-status').textContent='Draft kept in this tab.'}
function saveContext(key=state.gap){const text=state.contextDrafts[key]?.trim();if(!text)return false;if(state.contextNotes[key]!==text||state.contextOpen[key])state.sourceVersion++;state.contextNotes[key]=text;state.contextDrafts[key]=text;delete state.contextOpen[key];return true}
function enterContext(key){state.gap=key||gapKeys().find(k=>!state.contextNotes[k]&&!state.contextOpen[k])||state.gap;state.intakeReady=true;state.stage='context';state.contextPanel='question';state.error='';render();window.scrollTo(0,0)}
function contextOpenSummary(){const count=gapKeys().filter(key=>!state.contextNotes[key]).length;return count?`${count} topic${count===1?' is':'s are'} still open.`:'Your explanations are recorded. Files still need review.'}
function renderMaterialManager(){const dialog=$('#dialog');if(!dialog.open)modal('Project materials','');$('#dialog .dialog-body').innerHTML=`<p>Manage the source files without leaving your current question.</p><button class="btn" data-act="files">Add files</button><div class="file-list">${fileRows(state.files)||'<p class="muted">No files attached yet.</p>'}</div>${state.error?`<p role="alert" class="error">${esc(state.error)}</p>`:''}<p class="note" style="margin-top:20px">File names only. Real files are not uploaded or analyzed.</p><div class="dialog-actions"><button class="btn" data-act="close">Back to the question</button></div>`}
function requestPositioning(){if(state.briefDraft.trim()!==state.brief){modal('Save your brief changes?',`<p>Your written brief has unsaved changes. Save them before using the material in Positioning.</p><div class="dialog-actions"><button class="btn" data-act="edit-brief">Keep editing the brief</button><button class="btn primary" data-act="save-brief-continue">Save brief & continue</button></div>`);return}const unsaved=Object.keys(state.contextDrafts).filter(key=>state.contextDrafts[key]?.trim()&&state.contextDrafts[key].trim()!==state.contextNotes[key]);if(state.summaryEdit&&state.summaryDraft.trim()!==projectSummary().trim()){toast('Save or cancel your correction before continuing.');state.stage='context';render();$('#summary-edit').focus();return}if(unsaved.length){modal('Keep your unsaved context?',`<p>${unsaved.length} answer${unsaved.length>1?'s are':' is'} still a draft. Your words will not be lost.</p><div class="dialog-actions"><button class="btn" data-act="close">Keep editing</button><button class="btn primary" data-act="save-context-continue">Save answers & continue</button></div>`);return}finishContext()}
function handleMaterials(a,k,b){
 if(a==='about'){modal('A clearer starting point',`<p>Mockup 06: a quiet project map, one current question, and visible changes as you add context.</p><div class="source-excerpt"><strong>Try the whole loop</strong><p>Open the sample project, correct the understanding, answer or skip a question, attach related material, then explore positioning and create a discussion deck.</p></div><div class="source-excerpt"><strong>Simulation boundary</strong><p>Sample understanding, sources and positioning are prewritten. Files are names only, not read or uploaded. Your text is preserved literally and carried into the deck, not transformed by AI. State lasts in this tab until reload.</p></div><p style="margin-top:18px">The previous five mockups and the production app are unchanged.</p>`);return true}
 if(a==='toggle-paste'){state.pasteOpen=!state.pasteOpen;render();if(state.pasteOpen)$('#brief-input').focus();return true}
 if(a==='intake-continue'){if(!state.files.length&&!state.briefDraft.trim()){state.error='Add a file or a short written brief to continue.';render();return true}saveBrief();resumeClarify();return true}
 if(a==='open-sample'){if(!restoreSamples(true))return true;const brief=state.briefDraft.trim();if(brief&&brief!==state.brief){state.brief=brief;state.sourceVersion++}enterContext('moment');return true}
 if(a==='manage-materials'){state.materialPanel=true;renderMaterialManager();return true}
 if(a==='close'){state.materialPanel=false;return false}
 if(a==='edit-summary'){state.summaryEdit=true;state.summaryDraft=projectSummary();render();$('#summary-edit').focus();return true}
 if(a==='cancel-summary'){state.summaryEdit=false;render();return true}
 if(a==='save-summary'){const value=state.summaryDraft.trim();if(!value){toast('Write a short understanding before saving.');return true}if(value!==state.summaryOverride)state.sourceVersion++;state.summaryOverride=value;state.summaryEdit=false;render();toast('Your correction is saved. Sample directions are unchanged.');return true}
 if(a==='cluster'){state.gap=k;state.contextPanel=baseCoverage(clusterFor(k))==='covered'&&!state.contextNotes[k]?'details':'question';state.error='';state.overviewOpen=false;render();return true}
 if(a==='revise-context'){state.contextPanel='question';render();$('#context-answer')?.focus();return true}
 if(a==='next-useful'){enterContext();return true}
 if(a==='context-example'){state.contextDrafts[state.gap]=clusterFor(state.gap).example;render();$('#context-answer').focus();return true}
 if(a==='save-context'){const before=state.contextNotes[state.gap]||coverage(clusterFor(state.gap)).detail;if(!saveContext())return true;state.contextFeedback={before,after:state.contextNotes[state.gap]};state.contextPanel='saved';render();return true}
 if(a==='context-open'){const existing=state.contextNotes[state.gap],before=existing||coverage(clusterFor(state.gap)).detail;if(!state.contextOpen[state.gap])state.sourceVersion++;state.contextOpen[state.gap]=true;state.contextFeedback={before,after:existing?'Your earlier explanation is kept. Further context is left open.':'Left open for the client discussion.'};state.contextPanel='saved';render();return true}
 if(a==='context-next'){enterContext(k);return true}
 if(a==='context-finish'){requestPositioning();return true}
 if(a==='save-context-continue'){Object.keys(state.contextDrafts).forEach(saveContext);close();finishContext();return true}
 if(a==='nav'&&k==='source'){openMaterials();return true}
 if(a==='nav'&&k==='context'||a==='resume-clarify'){resumeClarify();return true}
 if(a==='linked-context'){state.materialPanel=false;close();enterContext(k);return true}
 if(a==='save-brief'){saveBrief();render();toast('Written brief saved. Existing decks are unchanged.');return true}
 if(a==='edit-brief'){close();state.pasteOpen=true;openMaterials();$('#brief-input')?.focus();return true}
 if(a==='save-brief-continue'){saveBrief();close();requestPositioning();return true}
 if(a==='nav'&&k==='positioning'){if(!state.intakeReady&&!state.files.length&&!state.briefDraft.trim()){toast('Add material or open the sample project to begin.');return true}requestPositioning();return true}
 if(a==='remove-file'){state.files=state.files.filter(f=>f.id!==(b.dataset.fileId||k));state.sourceVersion++;state.error='';render();return true}
 return false;
}

function contextLedger(){return clusters.map(c=>{const note=state.contextNotes[c.key],files=filesForGap(c.key),needs=baseCoverage(c)!=='covered';return note||files.length||needs?`${c.name}: ${note?`User-provided context (not verified): ${note}`:state.contextOpen[c.key]?'Left open by the consultant.':needs?'Context not yet provided.':''}${files.length?` Files awaiting review: ${files.map(f=>f.name).join(', ')}. Contents not analyzed.`:''}`:''}).filter(Boolean).join('\n\n')}
function showContext(){modal('Context carried into the positioning',`${state.summaryOverride?`<section class="source-excerpt"><strong>Your corrected understanding</strong><p class="context-quote">${esc(state.summaryOverride)}</p></section>`:''}${state.brief?`<section class="source-excerpt"><strong>Your brief · Not analyzed</strong><p class="context-quote">${esc(state.brief)}</p></section>`:''}<p>Your explanations inform the discussion. They do not become verified source evidence just because they were entered here.</p>${clusters.filter(c=>state.contextNotes[c.key]||filesForGap(c.key).length||baseCoverage(c)!=='covered').map(c=>`<section class="source-excerpt"><strong>${c.name}</strong><div class="context-quote">${esc(state.contextNotes[c.key]|| (state.contextOpen[c.key]?'Left open by you.':'No explanation supplied yet.'))}</div>${filesForGap(c.key).map(f=>`<p style="margin-top:10px">${esc(f.name)} · Pending review; contents not read.</p>`).join('')}</section>`).join('')}<div class="dialog-actions"><button class="btn" data-act="return-context">Revisit context</button><button class="btn primary" data-act="close">Back to positioning</button></div>`)}
function contextNotice(){const notes=Object.keys(state.contextNotes).length,files=state.files.filter(f=>f.gap).length;return `<div class="context-influence"><button class="source-link" data-act="project-context">Context & gaps${notes?` · ${notes} note${notes>1?'s':''}`:''}${files?` · ${files} file${files>1?'s':''} to review`:''} ↗</button></div>`}
function visibleDirection(){return state.pending?.direction?directions[state.pending.direction]:state.pending?.custom?state.pending.custom:current()}
function paperHTML(d,deckPage=null){
 const pending=!!state.pending,title=deckPage?deckPage.title:d.title;
 let sub=deckPage?deckPage.body:d.sub;
 const price=state.pending?.price??state.price,proof=state.pending?.proof??state.proof;
 if(!deckPage&&price==='everyday')sub+=' An everyday choice, without a premium-price promise.';
 const boundaries=!deckPage?[price==='open'?'Pricing remains an open question.':'',proof==='omit'?'No proven energy benefit is claimed. Product evidence is still needed.':proof==='hypothesis'?'Energy is a positioning hypothesis, pending product evidence.':''].filter(Boolean).join(' '):'';
 const reading=title.length>100||sub.length>260||!!boundaries;
 return `<article class="paper ${pending&&!deckPage?'pending':''} ${title.length>100?'custom':''} ${reading?'reading':''}" aria-label="${deckPage?'Deck page':'Working positioning'}"><div class="paper-brand"><span><i class="brand-sun" aria-hidden="true"></i>Northwind</span><span class="support-label">${deckPage?esc(deckPage.label):'A working point of view'}${reading?' · Reading layout':''}</span></div><div class="paper-body"><h2>${esc(title)}</h2><p>${esc(sub).replace(/\n/g,'<br>')}</p>${boundaries?`<div class="paper-limit">${esc(boundaries)}</div>`:''}</div><div class="paper-footer"><span>${deckPage?'Client discussion draft':'Brand positioning / Discussion draft'}</span><span>${deckPage?`${state.page+1} / 5`:'Proposed language, not a verified claim'}</span></div></article>`
}
function renderPositioning(){const d=visibleDirection();return `<div class="page-top"><div><h1>MAKE THE CALL.</h1><p>Follow a finding. Make a judgment. See the story change.</p></div><button class="btn small" data-act="compare">Compare directions</button></div>${changed()?'<div class="warning">Your deck is an earlier draft. Changes here do not overwrite it. <button class="plain" data-act="nav" data-key="deck">View saved deck</button></div>':''}<div class="mobile-switch"><button class="btn small ${state.mobile==='task'?'active':''}" data-act="mobile" data-key="task">Current question</button><button class="btn small ${state.mobile==='artifact'?'active':''}" data-act="mobile" data-key="artifact">Working story</button></div><div class="work-grid" data-mobile="${state.mobile}"><section class="artifact"><div class="artifact-head"><span><i class="status-dot"></i>${state.pending?'Proposed change · not applied':state.direction==='original'?'The client’s starting point':'Your working direction'}</span><button class="plain" data-act="undo" ${state.undo.length?'':'disabled'}>Undo last change</button></div>${paperHTML(d)}<div class="transformation"><div><div class="label">From being seen as</div><p>${esc(d.before)}</p></div><div class="after"><div class="label">To being understood as</div><p>${esc(d.after)}</p></div></div><div class="canvas-actions"><button class="plain" data-act="sources" data-keys="${d.refs.join(',')}">View supporting material ↗</button><button class="plain" data-act="original">Keep the original framing</button></div></section>${renderTask()}</div>${footer()}`}
function renderTask(){const q=questions[state.q];const tabs=`<div class="threads" aria-label="Open strategic questions">${questions.map((v,i)=>`<button class="${state.q===i?'active ':''}${state.saved[i]?'done':''}" data-act="question" data-key="${i}" aria-pressed="${state.q===i}">${v.tab}</button>`).join('')}</div>${contextNotice()}`;
 if(state.pending)return `<aside class="task">${tabs}<span class="eyebrow">The consequence of your judgment</span><h2>This is what changes.</h2><p class="decision-note">${esc(state.pending.impact)}</p><details><summary>Your words</summary><p>${esc(state.answers[state.q])}</p></details><button class="btn primary main-action" data-act="apply">Use this change ${arrow}</button><button class="plain quiet-action" data-act="adjust">Adjust my answer</button><p class="context-foot">Prewritten sample transformation. No AI call.</p></aside>`;
 if(!state.editing)return `<aside class="task">${tabs}<span class="eyebrow">Working direction</span><div class="accepted-icon">✓</div><h2>${esc(current().name)}</h2><p class="finding">${esc(current().tradeoff)}</p>${state.saved[state.q]?`<details><summary>Your judgment is included</summary><p>${esc(state.saved[state.q])}</p></details>`:''}<button class="btn primary main-action" data-act="generate">Use direction & create deck ${arrow}</button><button class="btn main-action" data-act="next-question">Explore another question</button><button class="plain quiet-action" data-act="edit-answer">Revisit this judgment</button><p class="context-foot">You do not have to answer every question. Open questions travel with the draft.</p></aside>`;
 return `<aside class="task">${tabs}<span class="eyebrow">A finding worth discussing</span><p class="finding" style="margin-top:10px">${q.finding}</p><button class="source-link" data-act="sources" data-keys="${q.refs.join(',')}">${q.refs.length} source excerpt${q.refs.length>1?'s':''} ↗</button><h2 style="margin-top:24px">${q.title}</h2><label for="answer">Your judgment</label><div class="presets">${q.options.map((v,i)=>`<button class="btn ${state.choice[state.q]===i?'active':''}" data-act="preset" data-key="${i}">${v.label}</button>`).join('')}</div><textarea id="answer" placeholder="Use a sample starting point, or write your own…"></textarea><button class="btn primary main-action" id="preview-btn" data-act="preview">Preview the impact ${arrow}</button><button class="plain quiet-action" data-act="skip">Leave this open for now</button><p class="context-foot">Sample choices demonstrate the change. Your own words are preserved; this mockup does not run AI.</p></aside>`}
function footer(){return `<footer class="flow-footer"><span>Interactive mockup · Fictional material · Resets on reload</span><button class="plain" data-act="about">What’s simulated?</button></footer>`}
function compare(){modal('Three different ways to lead the story',`<p>Compare the strategic choice, not just the headline. Nothing is approved by opening a direction.</p><div class="compare-grid">${['taste','energy','ritual'].map((key,i)=>{const d=directions[key];return `<article class="direction-card ${state.direction===key?'current':''}"><span class="eyebrow">Direction ${String.fromCharCode(65+i)}</span><h3>${d.name}</h3><p>${esc(d.title).replace(/\n/g,' ')}</p><div><span class="muted">The choice</span><p>${d.after}</p></div><div><span class="muted">The trade-off</span><p>${d.tradeoff}</p></div><button class="source-link" data-act="direction-evidence" data-key="${key}">Supporting material ↗</button><button class="btn ${state.direction===key?'light':''}" data-act="choose-direction" data-key="${key}">Preview direction ${String.fromCharCode(65+i)}</button></article>`}).join('')}</div><div class="dialog-actions"><button class="plain" data-act="original">Or keep the client’s original framing</button></div>`,true)}
function baseDeckPages(){const d=current(),price=state.price==='everyday'?'Leave premium pricing out of the opening promise.':state.price==='open'?'Premium pricing remains an open question.':'Pricing is unresolved; do not imply willingness to pay.';const proof=state.proof==='omit'?'Do not claim a proven energy benefit.':state.proof==='hypothesis'?'Energy remains a positioning hypothesis, pending product evidence.':'Product performance evidence is missing.';return [{label:'The positioning',title:d.title,body:d.sub},{label:'The shift',title:'A DIFFERENT WAY\nTO BE UNDERSTOOD.',body:`From: ${d.before}\n\nTo: ${d.after}`},{label:'The rationale',title:'WHY THIS STORY\nIS WORTH DISCUSSING.',body:`${d.rationale}\n\nAudience: ${d.audience}`},{label:'The evidence',title:'WHAT THE MATERIAL\nACTUALLY SUPPORTS.',body:d.refs.map(k=>`“${evidence[k].quote}”\n${evidence[k].file} · ${evidence[k].ref}`).join('\n\n')},{label:'The open questions',title:'THE CHOICE.\nAND WHAT COMES NEXT.',body:`${d.tradeoff}\n\n${price}\n${proof}\n\nConsultant judgments:\n${state.saved.filter(Boolean).join('\n')||'No judgments recorded. Discuss the open questions with the client.'}`} ]}
function deckPages(){const pages=baseDeckPages();if(state.summaryOverride)pages[2].body+=`\n\nUser-corrected project understanding (not independently verified):\n${state.summaryOverride}`;if(state.brief)pages[2].body+=`\n\nUser-provided brief (not analyzed):\n${state.brief}`;const notes=clusters.filter(c=>state.contextNotes[c.key]).map(c=>`${c.name}: ${state.contextNotes[c.key]}`).join('\n');if(notes)pages[2].body+=`\n\nUser-provided context (not independently verified):\n${notes}`;const open=clusters.filter(c=>baseCoverage(c)!=='covered'||filesForGap(c.key).length).map(c=>`${c.name}: ${filesForGap(c.key).length?`${filesForGap(c.key).map(f=>f.name).join(', ')} attached; contents not analyzed.`:state.contextNotes[c.key]?'Context recorded; supporting material may still be needed.':state.contextOpen[c.key]?'Left open by the consultant.':'Not yet provided.'}`).join('\n');if(open)pages[4].body+=`\n\nMaterial gaps & review status:\n${open}`;return pages}
function renderDeck(){const v=activeVersion(),p=v.pages[state.page],historical=v.id!==state.versions.at(-1).id;return `<div class="page-top"><div><h1>Northwind / Discussion deck</h1><p>${esc(v.direction)} · Draft ${v.id}${historical?' · Read-only history':''}</p></div><button class="btn small" data-act="nav" data-key="positioning">Revisit positioning</button></div>${changed()?'<div class="warning">Positioning or materials have changed since this draft. This saved deck is unchanged. Create a new draft from Positioning when ready.</div>':''}${historical?'<div class="warning">Viewing an earlier draft. <button class="plain" data-act="latest">Return to current draft</button></div>':''}<div class="work-grid deck-grid"><section class="artifact"><div class="artifact-head"><span>Client content takes the stage.</span><button class="plain" data-act="review">View all 5 pages</button></div>${paperHTML(null,p)}<nav class="deck-controls" aria-label="Deck pages">${v.pages.map((p,i)=>`<button class="${state.page===i?'active':''}" data-act="page" data-key="${i}" aria-current="${state.page===i?'page':'false'}" aria-label="Page ${i+1}: ${esc(p.label)}"><strong>${i+1}</strong><span>${esc(p.label.replace('The ',''))}</span></button>`).join('')}</nav></section><aside class="task deck-task"><div class="deck-info"><span class="eyebrow">Ready for your review</span><h2>Your point of view,<br>in five pages.</h2><p>Refine the wording before taking it into the client conversation.</p></div><button class="btn light" data-act="edit-page" ${historical?'disabled':''}>Edit this page</button><button class="btn" data-act="review">Review the complete deck</button><button class="btn primary" data-act="print-review">Print / save PDF</button><button class="plain" data-act="history">Draft history (${state.versions.length})</button><p class="context-foot">Saved in this tab only. Manual changes create a new draft. No PPTX export or real AI in this mockup.</p></aside></div>${footer()}`}
function review(printing=false){const v=activeVersion();modal(printing?'Review & print this draft':'The complete discussion deck',`<p>Draft ${v.id} · ${esc(v.direction)}. Browser printing can save a PDF; this is not PPTX export.</p>${v.pages.map((p,i)=>`<section class="review-page"><span class="small">Northwind / ${i+1} of 5</span><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p></section>`).join('')}<div class="dialog-actions"><button class="btn" data-act="close">Back to deck</button><button class="btn primary" data-act="print">Print / save PDF</button></div>`,true)}
function addFiles(files,gap=null){state.error='';let added=0;for(const f of files){if(!f.size){state.error=`${f.name} is empty. Choose a file with content.`;continue}if(f.size>20*1024*1024){state.error=`${f.name} exceeds this mockup’s 20 MB limit.`;continue}if(state.files.some(v=>v.name===f.name)){state.error=`${f.name} is already listed. Remove it before adding it again.`;continue}if(state.files.length>=20){state.error='This mockup supports up to 20 file names.';break}state.files.push({id:crypto.randomUUID(),name:f.name,type:(f.name.split('.').pop()||'FILE').slice(0,5).toUpperCase(),detail:gap?'Attached to context · Pending review':'Added locally · Contents not read',gap});added++}if(added)state.sourceVersion++;if(gap)state.uploadOpen[gap]=true;render();if(added)toast(gap?`Attached to ${clusterFor(gap).name}. The gap still needs review.`:`${added} file name${added>1?'s':''} added. No upload or analysis.`)}
$('#file-input').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
$('#gap-file-input').addEventListener('change',e=>{addFiles([...e.target.files],state.uploadGap||state.gap);e.target.value='';state.uploadGap=null});
document.addEventListener('toggle',e=>{if(e.target.matches?.('details.material-brief'))state.pasteOpen=e.target.open;if(e.target.matches?.('details.gap-upload'))state.uploadOpen[e.target.dataset.gap]=e.target.open},true);
document.addEventListener('click',e=>{const summary=e.target.closest('.overview-disclosure>summary');if(!summary)return;e.preventDefault();if(matchMedia('(max-width:760px)').matches){state.overviewOpen=!summary.parentElement.open;summary.parentElement.open=state.overviewOpen}});
matchMedia('(max-width:760px)').addEventListener('change',()=>{if(state.stage==='context')render()});
document.addEventListener('dragover',e=>{if(e.target.closest('#gap-dropzone')){e.preventDefault();$('#gap-dropzone').classList.add('dragging')}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#gap-dropzone'))$('#gap-dropzone').classList.remove('dragging')});
document.addEventListener('drop',e=>{if(e.target.closest('#gap-dropzone')){e.preventDefault();addFiles([...e.dataTransfer.files],state.gap)}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dropzone')){e.preventDefault();$('#dropzone').classList.add('dragging')}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#dropzone'))$('#dropzone').classList.remove('dragging')});
document.addEventListener('drop',e=>{if(e.target.closest('#dropzone')){e.preventDefault();addFiles([...e.dataTransfer.files])}});
document.addEventListener('input',e=>{if(e.target.id==='brief-input'){state.briefDraft=e.target.value;const status=$('#brief-status');if(status)status.textContent=state.briefDraft.trim()===state.brief?'No unsaved changes.':'Unsaved changes stay in this tab.';const badge=$('.material-brief summary span');if(badge)badge.textContent=state.briefDraft.trim()===state.brief?'Saved':'Unsaved changes'}if(e.target.id==='summary-edit')state.summaryDraft=e.target.value;if(e.target.id==='answer'){state.answers[state.q]=e.target.value;state.choice[state.q]=null;document.querySelectorAll('.presets button').forEach(b=>b.classList.remove('active'));$('#preview-btn').disabled=!e.target.value.trim()}if(e.target.id==='context-answer'){state.contextDrafts[state.gap]=e.target.value;updateContextControls()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,k=b.dataset.key;
 if(handleMaterials(a,k,b))return;
 if(a==='close'){close();return}
 if(a==='review-gaps'){enterContext();return}
 if(a==='back-materials'){state.stage='source';state.error='';render();window.scrollTo(0,0);return}
 if(a==='cluster'){const c=clusterFor(k);if(baseCoverage(c)==='covered'&&!state.contextNotes[k]&&!filesForGap(k).length){showSources(c.refs);return}enterContext(k);return}
 if(a==='gap-files'){state.uploadGap=state.gap;$('#gap-file-input').click();return}
 if(a==='context-example'){state.contextDrafts[state.gap]=clusterFor(state.gap).example;render();$('#context-answer').focus();return}
 if(a==='save-context'){saveContext();state.uploadOpen[state.gap]=true;render();toast('Context saved as your explanation. Supporting material is optional.');return}
 if(a==='context-open'){if(!state.contextOpen[state.gap])state.sourceVersion++;state.contextOpen[state.gap]=true;render();toast('Left open. Your existing notes are kept; no answer will be invented.');return}
 if(a==='context-next'){enterContext(k);return}
 if(a==='context-finish'){const drafts=Object.keys(state.contextDrafts).filter(key=>state.contextDrafts[key].trim()&&state.contextDrafts[key]!==state.contextNotes[key]&&!state.contextOpen[key]);if(drafts.length){modal('Keep your unsaved context?',`<p>You have ${drafts.length} answer${drafts.length>1?'s':''} not yet saved. Keep them as your explanations before moving into positioning.</p><div class="dialog-actions"><button class="btn" data-act="close">Keep editing</button><button class="btn primary" data-act="save-context-continue">Save answers & continue</button></div>`)}else finishContext();return}
 if(a==='save-context-continue'){Object.keys(state.contextDrafts).filter(key=>!state.contextOpen[key]).forEach(saveContext);close();finishContext();return}
 if(a==='project-context'){showContext();return}
 if(a==='return-context'){close();enterContext();return}
 if(a==='about'){modal('Context before positioning',`<p>Black-and-orange workspace. One continuous positioning conversation. A quieter canvas for the client’s work.</p><div class="source-excerpt"><strong>What you can try</strong><p>Review material clusters, answer a context question, attach a file to a specific gap, leave unknowns open, choose sample judgments, inspect evidence, preview a change, compare directions, keep the original, create a deck, edit it, undo and revisit earlier drafts.</p></div><div class="source-excerpt"><strong>What is simulated</strong><p>All material and transformations are fictional and prewritten. Real files are not read or uploaded. Free text is preserved, never silently treated as AI output. Everything resets on reload.</p></div><p style="margin-top:18px">The previous three mockups and the working application are unchanged.</p>`);return}
 if(a==='nav'){if(k==='deck'&&!state.versions.length)return;if(k==='positioning'){begin();return}state.stage=k;render();window.scrollTo(0,0);return}
 if(a==='files'){$('#file-input').click();return}
 if(a==='remove-file'){state.files=state.files.filter(f=>f.id!==(b.dataset.fileId||k));state.sourceVersion++;state.error='';render();return}
 if(a==='restore'){restoreSamples();render();return}
 if(a==='begin'){begin();return}
 if(a==='sample-confirm'){if(!restoreSamples())return;close();state.contextReviewedAt=state.sourceVersion;openPositioning();return}
 if(a==='mobile'){state.mobile=k;render();return}
 if(a==='sources'){showSources(b.dataset.keys.split(','));return}
 if(a==='direction-evidence'){close();showSources(directions[k].refs);return}
 if(a==='question'){state.q=Number(k);state.pending=null;state.editing=true;state.mobile='task';render();return}
 if(a==='preset'){const i=Number(k);state.choice[state.q]=i;state.answers[state.q]=questions[state.q].options[i].text;render();$('#answer').focus();return}
 if(a==='preview'){
  const option=questions[state.q].options[state.choice[state.q]];if(!state.answers[state.q].trim())return;
  if(option&&state.answers[state.q]===option.text){state.pending={...structuredClone(option),fromAnswer:true};state.mobile='artifact';render();toast('Preview only. Apply it when the change feels right.');return}
  modal('Keep your own judgment',`<p>This mockup does not rewrite free text with AI. We can keep it as a note, or use your exact words as the proposed headline.</p><div class="decision-note" style="white-space:pre-wrap">${esc(state.answers[state.q])}</div><div class="dialog-actions"><button class="btn" data-act="save-note">Keep as a judgment</button><button class="btn primary" data-act="use-words">Preview my words as headline</button></div>`);return
 }
 if(a==='use-words'){const text=state.answers[state.q];state.pending={fromAnswer:true,custom:{...structuredClone(current()),name:'Your own wording',title:text,sub:'Consultant-written expression. Preserved exactly as entered.',before:current().after,after:text},impact:'Your exact wording replaces the headline. This is not an AI rewrite.'};close();state.mobile='artifact';render();return}
 if(a==='save-note'){captureUndo();state.saved[state.q]=state.answers[state.q];state.revision++;state.editing=false;close();render();toast('Judgment saved. The headline is unchanged.');return}
 if(a==='adjust'){state.pending=null;state.editing=true;state.mobile='task';render();$('#answer')?.focus();return}
 if(a==='apply'){captureUndo();const p=state.pending;if(p.direction)state.direction=p.direction;if(p.custom){state.direction='custom';state.custom=p.custom}if(p.price)state.price=p.price;if(p.proof)state.proof=p.proof;if(p.fromAnswer)state.saved[state.q]=state.answers[state.q];state.pending=null;state.editing=false;state.revision++;render();toast('Working direction updated. A saved deck is not overwritten.');return}
 if(a==='edit-answer'){state.pending=null;state.editing=true;state.mobile='task';render();return}
 if(a==='skip'){state.pending=null;state.editing=false;render();toast('Left open. You can revisit this question at any time.');return}
 if(a==='next-question'){state.q=(state.q+1)%3;state.pending=null;state.editing=true;state.mobile='task';render();return}
 if(a==='compare'){compare();return}
 if(a==='choose-direction'){state.pending={direction:k,impact:`Previewing “${directions[k].name}”. This changes the lead story, audience and trade-off; your judgments stay attached.`};state.editing=false;state.mobile='artifact';close();render();return}
 if(a==='original'){state.pending={direction:'original',impact:'Keep the client’s starting point. The unresolved claims stay visible rather than being treated as proven.'};state.editing=false;state.mobile='artifact';close();render();return}
 if(a==='undo'){if(!state.undo.length)return;Object.assign(state,state.undo.pop());state.pending=null;state.revision++;state.editing=false;render();toast('Last positioning change undone.');return}
 if(a==='generate'){if(state.pending)return;const d=current();state.versions.push({id:state.versions.length+1,direction:d.name,revision:state.revision,sourceVersion:state.sourceVersion,pages:deckPages()});state.viewVersion=null;state.page=0;state.stage='deck';render();window.scrollTo(0,0);toast('New discussion draft created. Earlier drafts are preserved.');return}
 if(a==='page'){state.page=Number(k);render();return}
 if(a==='review'||a==='print-review'){review(a==='print-review');return}
 if(a==='print'){const v=activeVersion();$('#print').innerHTML=v.pages.map((p,i)=>`<section class="print-page"><small>Northwind / Discussion draft ${v.id} / ${i+1} of 5</small><h1>${esc(p.title)}</h1><p>${esc(p.body)}</p><small>Fictional sample · Not verified market claims</small></section>`).join('');window.print();return}
 if(a==='edit-page'){const p=activeVersion().pages[state.page];modal('Refine this page',`<label class="edit-label" for="edit-title">Page title</label><textarea id="edit-title">${esc(p.title)}</textarea><label class="edit-label" for="edit-body">Page content</label><textarea class="edit-area" id="edit-body">${esc(p.body)}</textarea><div class="dialog-actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-page">Save as a new draft</button></div>`);return}
 if(a==='save-page'){const title=$('#edit-title').value.trim(),body=$('#edit-body').value.trim();if(!title){toast('Add a page title before saving.');return}const v=structuredClone(activeVersion());v.id=state.versions.length+1;v.pages[state.page]={...v.pages[state.page],title,body};state.versions.push(v);state.viewVersion=null;close();render();toast('Saved as a new draft. The previous version is still available.');return}
 if(a==='history'){modal('Draft history',state.versions.slice().reverse().map(v=>`<div class="history-row"><div><strong>Draft ${v.id}</strong><p class="small muted">${esc(v.direction)}</p></div><button class="btn small" data-act="view-version" data-key="${v.id}">View draft ${v.id}</button></div>`).join(''));return}
 if(a==='view-version'){state.viewVersion=Number(k);close();render();return}
 if(a==='latest'){state.viewVersion=null;render();return}
});
function begin(){requestPositioning()}
function restoreSamples(silent=false){const missing=sampleFiles.filter(f=>!state.files.some(v=>v.id===f.id));if(state.files.length+missing.length>20){toast('Remove a file before restoring the sample sources. Your attachments are unchanged.');return false}state.files.push(...structuredClone(missing));if(missing.length)state.sourceVersion++;state.error='';if(!silent)toast('Sample sources restored. Your notes and attachments are kept.');return true}
function finishContext(){const complete=sampleFiles.every(f=>state.files.some(v=>v.id===f.id));if(!complete){modal('Add the sample sources for the demo?',`<p>Your answers and attached files will be kept. The next screen uses prewritten Northwind examples, not analysis of your files. Restore the missing sample sources to explore that interaction.</p><div class="dialog-actions"><button class="btn" data-act="close">Keep working on context</button><button class="btn primary" data-act="sample-confirm">Add sample sources & continue</button></div>`);return}state.contextReviewedAt=state.sourceVersion;openPositioning()}
function openPositioning(){state.intakeReady=true;state.opened=true;state.stage='positioning';state.mobile='task';render();window.scrollTo(0,0)}
render();
</script>
