<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deckdraft — 公司信息转 Pitch Deck</title>
  <meta name="description" content="输入公司事实，生成可浏览的 pitch deck 草稿。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23121620'/%3E%3Cpath d='M17 18h21c8 0 13 5 13 14s-5 14-13 14H17V18Zm9 8v12h11c4 0 6-2 6-6s-2-6-6-6H26Z' fill='%23ff6b45'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">D</span><span>Deckdraft</span></div>
    <div class="status"><span></span> 本地原型 · 不上传数据</div>
  </header>

  <main class="workspace">
    <section class="input-panel" aria-labelledby="input-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">01 · 公司事实</p>
          <h1 id="input-title">先把信息讲清楚</h1>
        </div>
        <button id="sampleButton" class="text-button" type="button">载入样例</button>
      </div>

      <form id="companyForm">
        <label>公司名称<input name="name" value="澄光能源" required></label>
        <label>一句话介绍<textarea name="oneLiner" rows="2" required>为中小型工厂提供模块化储能系统，降低峰值电费和停电损失。</textarea></label>

        <div class="two-col">
          <label>目标客户<input name="customer" value="年用电量 500 万度以上的制造工厂"></label>
          <label>融资目标<input name="ask" value="融资 2,000 万元"></label>
        </div>

        <label>客户现在遇到的问题<textarea name="problem" rows="3">工厂电价波动大，扩容审批慢；传统储能项目交付周期长，而且客户很难判断实际回报。</textarea></label>
        <label>你的解决方案<textarea name="solution" rows="3">标准化储能柜配合能耗预测软件，六周内完成部署；按月展示节省金额和设备状态。</textarea></label>

        <div class="two-col">
          <label>商业模式<input name="model" value="设备销售 + 年度软件订阅"></label>
          <label>所在市场<input name="market" value="中国工商业储能"></label>
        </div>

        <label>已验证进展<textarea name="traction" rows="3">已签约 18 家工厂；在运容量 32MWh；过去 12 个月收入 3,600 万元；客户续约率 94%。</textarea></label>
        <label>团队优势<textarea name="team" rows="2">创始团队来自宁德时代、远景能源和施耐德，累计交付 120+ 工商业能源项目。</textarea></label>
        <label>资金用途<textarea name="use" rows="2">扩大华东交付团队；完成第二代储能柜认证；补充项目周转资金。</textarea></label>

        <div class="quality" aria-live="polite">
          <div class="quality-row"><span>信息完整度</span><strong id="qualityScore">100%</strong></div>
          <div class="quality-track"><span id="qualityBar"></span></div>
          <p id="qualityHint">信息足够生成一版投资人演示稿。</p>
        </div>
        <button class="primary" type="submit">生成 8 页 Pitch Deck</button>
      </form>
    </section>

    <section class="preview-panel" aria-labelledby="preview-title">
      <div class="preview-head">
        <div>
          <p class="eyebrow">02 · 叙事草稿</p>
          <h2 id="preview-title">投资人演示稿</h2>
        </div>
        <div class="preview-actions">
          <button id="presentButton" class="secondary" type="button">全屏演示</button>
          <button id="copyButton" class="secondary" type="button">复制大纲</button>
        </div>
      </div>

      <div class="deck-shell">
        <aside id="thumbs" class="thumbs" aria-label="页面导航"></aside>
        <div class="stage-wrap">
          <div id="slide" class="slide" tabindex="0" aria-live="polite"></div>
          <div class="slide-controls">
            <button id="prevButton" type="button" aria-label="上一页">←</button>
            <span id="pageCount">1 / 8</span>
            <button id="nextButton" type="button" aria-label="下一页">→</button>
          </div>
        </div>
      </div>

      <div class="logic-note">
        <strong>这版 demo 验证什么</strong>
        <p>输入的事实能否稳定生成一条完整叙事。市场规模等缺失数据不会被编造，而会显示为“待补充”。</p>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
