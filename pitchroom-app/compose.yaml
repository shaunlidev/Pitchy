services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pitchroom
      POSTGRES_USER: pitchroom
      POSTGRES_PASSWORD: pitchroom
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchroom -d pitchroom"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pitchroom_postgres:/var/lib/postgresql/data

volumes:
  pitchroom_postgres:
